[pytest]
testpaths = tests
python_files = test_*.py
# `-p no:randomly`: si alguien tiene instalado pytest-randomly (NO está en
# requirements.txt, pero se cuela en cualquier ambiente que lo arrastre), el
# plugin baraja el orden de los tests en cada corrida. Esta suite tiene ~50
# tests que dependen del orden (ver docs/tests_dependientes_del_orden.md; por
# eso el Makefile agrupa por archivo con --dist loadfile), así que barajar
# rompe tests distintos en cada vuelta y manda a buscar bugs que no existen.
# Bloquear el plugin por nombre es inofensivo si no está instalado.
addopts = -ra --strict-markers --tb=short -p no:randomly
filterwarnings =
    ignore::DeprecationWarning:flask_limiter.*
    ignore::DeprecationWarning:werkzeug.*
markers =
    db: tests that hit a real Postgres (skip by default; run with `pytest -m db`)
