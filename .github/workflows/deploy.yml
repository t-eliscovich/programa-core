name: Deploy to EC2

# Cuando se ejecuta:
#   - lo llama ci.yml cuando los tests dieron verde en main (el camino normal)
#   - manual desde la UI de Actions ("Run workflow") → redeploy sin esperar a nadie
#
# Cómo funciona:
#   1. Empaqueta el repo en tarball y lo sube a S3 con la key de ESTE commit
#      (s3://intela-deploy-<acct>/programa_core_deploy/<sha>.tar.gz).
#      En el camino normal ese paso ya lo hizo el job `paquete` de ci.yml EN
#      PARALELO con los tests, así que acá se saltea.
#   2. Manda SSM al EC2 que descarga, extrae, pip install si cambió,
#      corre las migraciones, reinicia las tareas, y hace health check.
#
# Auth: asume el IAM role `programa-core-deploy` via OIDC (sin keys hardcodeadas).
# El role ARN está en el secret AWS_DEPLOY_ROLE_ARN del repo.

# TMT 2026-08-10 (dueña): *"podemos hacer un future stop para que esto no
# pase"*. Antes este workflow arrancaba del MISMO push que el CI y corría EN
# PARALELO, así que el CI no frenaba nada: el 10/08 el run de `bef582b` quedó
# rojo y el deploy salió igual, con el código ya en producción. El CI era un
# aviso, no un freno — y si nadie mira el aviso, no existe.
#
# TMT 2026-08-27 — de `workflow_run` a WORKFLOW REUSABLE. El freno se mantiene
# igual (no se deploya sin tests verdes) pero ahora es un `needs:` adentro de
# ci.yml en vez de un workflow aparte que espera a que el otro TERMINE. Lo que
# se gana son los ~9 s del salto: GitHub tardaba 4 s en cerrar la corrida del
# CI, 3 s en despachar el evento y 2 s más en levantar el job.
#   - Se fue el job `bloqueado`: existía porque un deploy disparado por
#     `workflow_run` con el CI rojo quedaba en "skipped" — gris, sin mail, o
#     sea equivalente a que no pase nada. Como job de ci.yml eso ya no puede
#     pasar: si los tests fallan, el que queda ROJO es el CI mismo.
#   - Se fue la trampa del `head_sha`: en un `workflow_run`, `github.sha` NO
#     era el commit testeado sino la punta de la rama al momento del evento.
#     Ahora el commit entra por `inputs.sha`.
#   - `workflow_dispatch` sigue existiendo: es la salida si un test flaky
#     bloquea un deploy urgente.
on:
  workflow_call:
    inputs:
      sha:
        description: El commit a deployar.
        required: true
        type: string
      ya_subido:
        description: >-
          true si el tarball de este commit YA está en S3 (lo subió el job
          `paquete` de ci.yml en paralelo con los tests). Si es false se
          empaqueta acá, que es lo que pasa en el redeploy a mano.
        required: false
        default: false
        type: boolean
  workflow_dispatch:

permissions:
  id-token: write   # necesario para OIDC
  contents: read

# TMT 2026-08-27 — DOS DEPLOYS A LA VEZ. El 27/08 a las 20:08 corrieron dos
# deploys solapados contra el MISMO server (runs 2940 y 2941). Además de
# reiniciar la app dos veces, había una carrera de verdad: el tarball se subía
# SIEMPRE a la misma key de S3, así que el deploy A podía bajarse el tarball
# que subió el deploy B y dejar en producción un commit que no era el suyo.
# La key ahora va por SHA (abajo) y acá se serializa: el que está corriendo
# nunca se corta a la mitad (`cancel-in-progress: false`), y si mientras tanto
# se encolan dos, GitHub deja sólo el último — que es el que hay que deployar.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Llamado desde ci.yml viene el commit que los tests aprobaron; a mano,
      # la punta de la rama donde se apretó "Run workflow".
      DEPLOY_SHA: ${{ inputs.sha || github.sha }}

    steps:
      # El OIDC va PRIMERO: sin credenciales no se puede ni firmar la URL, y en
      # el camino normal ni checkout hace falta (el tarball ya está en S3).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # Los dos pasos que siguen SÓLO corren en el redeploy a mano. Cuando lo
      # llama ci.yml, el job `paquete` ya subió el tarball de este commit
      # mientras corrían los tests, así que acá nos ahorramos el checkout (3 s)
      # y la subida a S3 (7 s).
      - name: Checkout
        if: ${{ inputs.ya_subido != true }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Empaquetar y subir a S3
        if: ${{ inputs.ya_subido != true }}
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: scripts/empaquetar_y_subir_deploy.sh "$DEPLOY_SHA" "$ROLE_ARN"

      - name: Firmar la URL de descarga
        id: upload
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          # Presigned URL para que el EC2 lo baje (más simple que un IAM rol en
          # el EC2). La key es determinística —el SHA— así que no hace falta que
          # el job que subió el tarball nos pase nada.
          ACCT=$(printf '%s' "$ROLE_ARN" | cut -d: -f5)
          if [ -z "$ACCT" ]; then
            ACCT=$(aws sts get-caller-identity --query Account --output text)
          fi
          S3_KEY="programa_core_deploy/${DEPLOY_SHA}.tar.gz"
          URL=$(aws s3 presign "s3://intela-deploy-${ACCT}/${S3_KEY}" --expires-in 1800 --region us-east-2)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM (download + extract + pip + restart + healthcheck)
        id: deploy
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.url }}
          COMMIT_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          # Construímos el PowerShell que va a correr en el EC2.
          # Pasamos URL y SHA como vars al script.
          SCRIPT=$(cat <<'PSEOF'
          $ErrorActionPreference = 'Continue'
          $env:PYTHONIOENCODING = 'utf-8'
          $url = '__DOWNLOAD_URL__'
          $sha = '__COMMIT_SHA__'

          Write-Output "=== Deploy commit $sha ==="
          $ProgressPreference = 'SilentlyContinue'

          # TMT 2026-08-27 — un RELOJ. El stdout del SSM no trae horas, así que
          # para saber dónde se van los ~28 s de este script había que adivinar
          # (¿el tar? ¿migrate.py? ¿el portal?). `paso` estampa el segundo de
          # cada hito; la próxima vez que haya que recortar, se mira el log.
          $t0 = Get-Date
          function paso($m) { Write-Output ("[{0,5:N1}s] {1}" -f ((Get-Date) - $t0).TotalSeconds, $m) }

          # 0. Huella de la SECRET_KEY ANTES de tocar nada. TMT 2026-08-07
          #    (y ya el 2026-07-06): *"¿por qué se sale de mi sesión?"*. Si la
          #    clave rota en el reinicio, TODAS las cookies dejan de valer y se
          #    desloguea todo el mundo — y sin este par de líneas la única
          #    forma de saberlo era acordarse de mirar /healthz a mano justo
          #    antes y justo después. Ahora queda en el log del deploy.
          $fpAntes = '?'
          try { $fpAntes = (Invoke-WebRequest -UseBasicParsing http://localhost:5002/healthz -TimeoutSec 10).Content | ConvertFrom-Json | Select -ExpandProperty secret_fp } catch {}
          Write-Output "SECRET_KEY antes: $fpAntes"

          # 1. Backup del previous .env (por las dudas, aunque no lo deberíamos tocar).
          if (Test-Path C:\programa-core\.env) { Copy-Item C:\programa-core\.env C:\tmp\dotenv.backup -Force }

          # 2. Descargar tarball
          (New-Object System.Net.WebClient).DownloadFile($url, 'C:\tmp\deploy.tar.gz')
          paso "bajado el tarball ($((Get-Item C:\tmp\deploy.tar.gz).Length) bytes)"

          # 3. Extraer en sitio. tar -xzf overwrites pero NO BORRA archivos que
          #    ya no están en el repo — y eso nos mordió el 2026-08-13: al
          #    renumerar dos migraciones, las viejas quedaron en el server al
          #    lado de las nuevas, y el candado de números pisados frenó el
          #    deploy. Había además TRES fantasmas de renumeraciones anteriores
          #    (0094, 0120, 0185) que nadie había visto nunca.
          #
          #    `migrations/` es 100% del repo (no se genera nada ahí adentro),
          #    así que se borra entera antes de extraer y queda igual al repo.
          #    El resto del árbol se sigue pisando encima a propósito: ahí sí
          #    viven archivos del server (.env, .deps_hash, data/).
          if (-not (Test-Path C:\programa-core)) { New-Item -ItemType Directory -Path C:\programa-core | Out-Null }

          # ⭐ TMT 2026-08-25 — PARAR ANTES DE EXTRAER. El deploy del 25/08 murió
          #    con `./static/mi-cartera/icon-180.png: Can't unlink
          #    already-existing object: Permission denied`: en Windows un archivo
          #    ABIERTO no se puede borrar, y tar borra antes de escribir. Los dos
          #    procesos (la oficina en el 5002 y el portal en el 5004) estaban
          #    sirviendo esa carpeta con el mismo ejecutable, así que cualquier
          #    estático que un cliente estuviera bajando justo en ese segundo
          #    frenaba el deploy entero. No es del icono: le puede tocar a
          #    cualquier archivo, y por eso no se arregla borrando ese archivo.
          #
          #    ⚠ El precio es que la app queda abajo durante el extract + las
          #    migraciones (~10 s en vez de ~2). Se paga: un deploy que falla la
          #    deja abajo hasta que alguien lo mire.
          paso "parando los procesos antes de extraer"
          Stop-ScheduledTask -TaskName ProgramaCoreApp -ErrorAction SilentlyContinue
          Stop-ScheduledTask -TaskName PortalClienteApp -ErrorAction SilentlyContinue
          # TMT 2026-08-27: acá había un `Start-Sleep 2` fijo. No hacía falta:
          # el loop de abajo YA pregunta por el puerto y mata por PID, así que
          # esperar a ciegas antes de preguntar sólo suma dos segundos a cada
          # deploy. Si el proceso todavía está, el loop lo ve y lo mata igual.
          foreach ($puerto in 5002, 5004) {
            for ($i = 0; $i -lt 6; $i++) {
              $owners = Get-NetTCPConnection -LocalPort $puerto -State Listen -ErrorAction SilentlyContinue |
                        Select-Object -ExpandProperty OwningProcess -Unique
              if (-not $owners) { break }
              $owners | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
              Start-Sleep 1
            }
          }
          # Los estáticos pueden quedar de sólo lectura por una copia vieja: tar
          # tampoco los puede pisar. Es barato y no molesta si ya estaban bien.
          if (Test-Path C:\programa-core\static) {
            Get-ChildItem C:\programa-core\static -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object { try { $_.IsReadOnly = $false } catch { } }
          }
          if (Test-Path C:\programa-core\migrations) {
              Remove-Item -Recurse -Force C:\programa-core\migrations
              Write-Output "migrations/ borrada antes de extraer (queda igual al repo)"
          }
          # Reintento: aunque los procesos estén parados, Windows puede tardar
          # un segundo en soltar un handle. Tres intentos con un segundo de por
          # medio evitan tener que volver a pushear por eso.
          for ($i = 1; $i -le 3; $i++) {
            tar -xzf C:\tmp\deploy.tar.gz -C C:\programa-core
            if ($LASTEXITCODE -eq 0) { break }
            Write-Output "tar falló (intento $i), reintentando..."
            Start-Sleep 2
          }
          if ($LASTEXITCODE -ne 0) { Write-Output "ERROR: tar exit $LASTEXITCODE"; exit 1 }
          paso "extraido"

          # 4. pip install. TMT 2026-08-13 (dueña: *"necesito todavía más
          #    corto"*): corría SIEMPRE, aunque requirements.txt no hubiera
          #    cambiado — y no cambia casi nunca. Ahora se guarda el hash del
          #    archivo en C:\programa-core\.deps_hash (que no viaja en el
          #    tarball, vive en el server) y sólo se instala si difiere.
          #    Si algo quedara desincronizado, borrar ese archivo fuerza el
          #    install en el próximo deploy.
          #
          #    ⭐ Y de paso: antes esto era `pip ... | Select -Last 3`, y el
          #    exit code de un pipe en PowerShell es el del ÚLTIMO comando
          #    (Select), no el de pip. O sea que un pip que fallaba pasaba
          #    DESAPERCIBIDO y el deploy seguía como si nada. Ahora se guarda
          #    el $LASTEXITCODE de pip antes de imprimir nada.
          Set-Location C:\programa-core
          $reqHash = (Get-FileHash C:\programa-core\requirements.txt -Algorithm SHA256).Hash
          $hashPrevio = ''
          if (Test-Path C:\programa-core\.deps_hash) { $hashPrevio = (Get-Content C:\programa-core\.deps_hash -Raw).Trim() }
          if ($reqHash -ne $hashPrevio) {
              Write-Output "requirements.txt cambio -> pip install"
              $pipOut = & C:\Python312\python.exe -m pip install -r requirements.txt --quiet --disable-pip-version-check 2>&1
              $pipRC = $LASTEXITCODE
              $pipOut | Select-Object -Last 3
              if ($pipRC -ne 0) { Write-Output "ERROR: pip install salio $pipRC — no se reinicia nada"; exit 1 }
              Set-Content -Path C:\programa-core\.deps_hash -Value $reqHash
          } else {
              Write-Output "requirements.txt sin cambios -> salteo pip"
          }

          # 4b. MIGRACIONES, antes del restart. TMT 2026-08-09 (dueña):
          #     *"¿podríamos hacer que las migraciones corran junto con el
          #     deploy?"*. Hasta hoy había que acordarse de abrir
          #     /admin/migraciones y apretar el botón, y olvidarse daba un
          #     deploy VERDE con el cambio a medias: el código nuevo arriba y
          #     la base sin tocar. Nada se rompe — el cambio simplemente no
          #     pasó, que es la forma más difícil de notarlo. Ocurrió el mismo
          #     09/08 con la 0182.
          #
          #     ⭐ ANTES del restart, no después: el proceso nuevo tiene que
          #     nacer contra el schema que espera. Quedan ~20 s en los que el
          #     proceso VIEJO ve el schema nuevo — inofensivo para lo que
          #     agrega o para permisos, que es casi todo lo que escribimos, y
          #     es el mismo riesgo que ya corría el botón a mano con la app
          #     andando.
          #
          #     ⚠ Si una migración falla, SE CORTA ACÁ y no se reinicia nada:
          #     queda el código viejo con el schema viejo, la única de las
          #     cuatro combinaciones que es coherente. Reiniciar igual dejaría
          #     el código nuevo contra una base a medio migrar. migrate.py es
          #     idempotente: arreglar y volver a deployar es seguro.
          paso "dependencias listas"
          Write-Output "=== Migraciones ==="
          & C:\Python312\python.exe scripts\migrate.py 2>&1 | Select -Last 20
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR: migrate.py salió $LASTEXITCODE — NO se reinicia la app (queda el código viejo con el schema viejo). Mirá /admin/migraciones."
            exit 1
          }
          paso "migraciones al dia"

          # 5. Restart task. TMT 2026-06-07: matar el python.exe HUÉRFANO que
          #    queda tomando el puerto 5002. Stop-ScheduledTask para la TAREA
          #    pero no siempre mata el proceso hijo; el python nuevo entonces
          #    no puede bindear el puerto, sale, y el viejo sigue sirviendo →
          #    el código nuevo NUNCA se carga (deploys silenciosamente no-op).
          # TMT 2026-08-27: acá había OTRO `Stop-ScheduledTask` + `Start-Sleep 2`.
          # Era de cuando el paso 3 no paraba nada; desde el 25/08 los dos
          # procesos ya vienen muertos de ahí arriba y NADIE los arrancó en el
          # medio, así que este segundo parate paraba lo que ya estaba parado y
          # dormía dos segundos por deploy al pedo. El kill por puerto de abajo
          # se queda: es el que agarra al huérfano y sale en 0 s si no hay.
          # TMT 2026-08-01: SACADO el kill por NOMBRE de proceso
          #   Get-Process python  | Stop-Process -Force
          #   Get-Process pythonw | Stop-Process -Force
          # `Get-Process python` agarra TODOS los python.exe del server, no sólo
          # el nuestro: formulas_app corre Waitress en el 5001 con el mismo
          # ejecutable. Cada deploy de Programa Core la mataba de paso — 57
          # caídas el 31/07, siempre exit -1 y siempre 2s después de esta línea.
          # No se notaba porque launch_waitress.ps1 la relanza a los 5s.
          # El kill por PUERTO de abajo resuelve el huérfano sin daño colateral.
          # TMT 2026-07-31: matar por PUERTO. Verificado que el deploy subía
          # los archivos pero el proceso Python NO se reiniciaba (un huérfano/detachado
          # seguía tomando el 5002 y el Get-Process python no lo agarraba): las
          # PLANTILLAS cambiaban (se leen del disco por request) pero la LÓGICA Python
          # no (queda en RAM hasta reiniciar) → cambios de fórmula (ej. egreso) no
          # cargaban aunque el deploy diera verde. Get-NetTCPConnection da el PID dueño
          # del 5002 y lo matamos por PID, sea cual sea el proceso.
          for ($i = 0; $i -lt 6; $i++) {
            $owners = Get-NetTCPConnection -LocalPort 5002 -State Listen -ErrorAction SilentlyContinue |
                      Select-Object -ExpandProperty OwningProcess -Unique
            if (-not $owners) { break }
            $owners | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
            Start-Sleep 1
          }
          # TMT 2026-08-13: era `Start-Sleep 3` fijo. Ahora se PREGUNTA si el
          # puerto quedó libre, hasta 8 veces por segundo de espera: en el caso
          # normal sale en 0-1 s, y si tarda más espera más que antes.
          for ($i = 0; $i -lt 8; $i++) {
            if (-not (Get-NetTCPConnection -LocalPort 5002 -State Listen -ErrorAction SilentlyContinue)) { break }
            Start-Sleep 1
          }
          # Verificar que el 5002 quedó LIBRE antes de arrancar; si sigue tomado, el
          # nuevo no bindea y volvemos al no-op → fallar el deploy para que se vea.
          $still = Get-NetTCPConnection -LocalPort 5002 -State Listen -ErrorAction SilentlyContinue
          if ($still) { Write-Output "ERROR: puerto 5002 sigue tomado por PID(s) $($still.OwningProcess -join ',') — no se pudo liberar"; exit 1 }
          Start-ScheduledTask -TaskName ProgramaCoreApp
          paso "arrancada la oficina (5002)"

          # 5.b El PORTAL DEL CLIENTE — el mismo código en otro proceso y otro
          #     puerto (5004, run_portal.py). Comparte carpeta con el programa
          #     de la oficina, así que este deploy también le cambió los
          #     archivos abajo de los pies: hay que reiniciarlo o queda
          #     sirviendo el código viejo.
          #     Es FAIL-SOFT a propósito: si la tarea todavía no existe en el
          #     server —o si el portal se cae— eso NO puede frenar el deploy
          #     del programa con el que trabaja la oficina todo el día.
          #
          # ⭐ TMT 2026-08-27 — ARRANCA ACÁ, SE PREGUNTA ABAJO. Antes este bloque
          #    entero (parar + dormir 2 + matar + dormir 1 + arrancar + esperar
          #    hasta 30 s a que conteste 200) corría ENTERO antes del health
          #    check de la oficina. O sea: la oficina ya estaba sirviendo el
          #    código nuevo y el deploy seguía en rojo esperando al portal —
          #    "Health: HTTP 200 (contesto a los 1 s)" en el log es justamente
          #    eso, llegábamos tarde a preguntar. Ahora los dos procesos
          #    booteán A LA VEZ y el deploy tarda lo que tarda el más lento en
          #    vez de la suma de los dos. El parar/matar ya lo hizo el paso 3.
          $portalHay = [bool](Get-ScheduledTask -TaskName PortalClienteApp -ErrorAction SilentlyContinue)
          if ($portalHay) {
              Get-NetTCPConnection -LocalPort 5004 -State Listen -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty OwningProcess -Unique |
                  ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
              Start-ScheduledTask -TaskName PortalClienteApp -ErrorAction SilentlyContinue
              paso "arrancado el portal (5004)"
          } else {
              Write-Output "Portal del cliente: la tarea PortalClienteApp no existe todavia — salteado"
          }

          # 6. Health check. TMT 2026-08-13 (dueña: *"necesito todavía más
          #    corto"*): acá había un `Start-Sleep 15` fijo y RECIÉN DESPUÉS se
          #    preguntaba. Los 15 s salieron del 2026-06-07 porque con 6 s el
          #    check daba falso negativo — pero el problema nunca fue el número,
          #    era esperar a ciegas. Ahora se pregunta cada segundo hasta 40:
          #    en el caso normal corta apenas Waitress contesta (~5-8 s), y si
          #    algún día tarda 30 s espera 30 en vez de fallar como antes.
          #    TMT 2026-08-27: se PREGUNTA PRIMERO y se duerme después. Con el
          #    `Start-Sleep 1` adelante, una app que ya estaba arriba (pasa
          #    siempre que el portal se llevó unos segundos booteando en
          #    paralelo) igual pagaba un segundo de peaje.
          $code = 0
          $espera = 0
          for ($i = 0; $i -lt 40; $i++) {
              try {
                  $code = (Invoke-WebRequest -UseBasicParsing http://localhost:5002/login -TimeoutSec 5).StatusCode
              } catch { $code = 0 }
              if ($code -eq 200) { $espera = $i; break }
              Start-Sleep 1
          }
          $state = (Get-ScheduledTask -TaskName ProgramaCoreApp).State
          Write-Output "Task state: $state"
          paso "oficina: HTTP $code (contesto a los $espera s)"
          if ($code -ne 200) {
              Write-Output "Health FAIL: la app no contesto 200 en 40s"
              exit 1
          }

          # 6.b Recién ahora el portal, que viene booteando desde el paso 5.b.
          #     En el caso normal ya está arriba y esto sale en 0 s. Sigue
          #     siendo FAIL-SOFT: el portal caído avisa pero no frena el deploy
          #     del programa con el que trabaja la oficina todo el día.
          if ($portalHay) {
              $pcode = 0
              for ($i = 0; $i -lt 30; $i++) {
                  try { $pcode = (Invoke-WebRequest -UseBasicParsing http://localhost:5004/ -TimeoutSec 5).StatusCode } catch { $pcode = 0 }
                  if ($pcode -eq 200) { break }
                  Start-Sleep 1
              }
              paso "portal: HTTP $pcode"
              if ($pcode -ne 200) { Write-Output "AVISO: el portal no contesto 200 — el programa de la oficina NO se toca por esto" }
          }
          $fpDespues = '?'
          try { $fpDespues = (Invoke-WebRequest -UseBasicParsing http://localhost:5002/healthz -TimeoutSec 10).Content | ConvertFrom-Json | Select -ExpandProperty secret_fp } catch {}
          Write-Output "SECRET_KEY despues: $fpDespues"
          if ($fpAntes -ne '?' -and $fpDespues -ne '?' -and $fpAntes -ne $fpDespues) {
              Write-Output "AVISO: la SECRET_KEY ROTO en este deploy ($fpAntes -> $fpDespues) — todas las sesiones se cerraron. Revisar C:\programa-core\.secret_key"
          }
          paso "=== Deploy OK ==="
          PSEOF
          )
          SCRIPT=${SCRIPT//__DOWNLOAD_URL__/$DOWNLOAD_URL}
          SCRIPT=${SCRIPT//__COMMIT_SHA__/$COMMIT_SHA}

          # Encode en base64 y mandar via SSM con file://
          B64=$(printf '%s' "$SCRIPT" | base64 -w0)
          cat > /tmp/p.json <<JSONEOF
          {"commands":["[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('${B64}')) | Invoke-Expression"]}
          JSONEOF

          CMD_ID=$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids i-0fcca4d7029f08489 \
            --document-name AWS-RunPowerShellScript \
            --parameters file:///tmp/p.json \
            --query Command.CommandId --output text)

          echo "Command ID: $CMD_ID"

          # Poll cada 5s, máximo 4 minutos
          # TMT 2026-08-13: era `sleep 5` (hasta 5 s de retraso en enterarse
          # de que ya terminó). Mismo techo de 4 min, mejor resolución.
          for i in {1..120}; do
            sleep 2
            STATUS=$(aws ssm get-command-invocation \
              --region us-east-2 \
              --instance-id i-0fcca4d7029f08489 \
              --command-id "$CMD_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
          done

          # Mostrar el output completo
          echo "=== SSM output ==="
          aws ssm get-command-invocation \
            --region us-east-2 \
            --instance-id i-0fcca4d7029f08489 \
            --command-id "$CMD_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          # Fallar el step si el SSM no terminó OK
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed (final status: $STATUS)"
            exit 1
          fi
