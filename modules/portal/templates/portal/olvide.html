{% extends "portal/base.html" %}
{% block titulo %}Olvidé mi clave — Intela{% endblock %}
{% block contenido %}
  <div class="titulo">Olvidé mi clave</div>
  <p class="bajada">Le mandamos un código de 6 números a su correo.</p>

  <form method="post">
    {{ csrf_token_input | safe }}
    <div class="campo">
      <label for="identificador">RUC o cédula</label>
      <input class="ruc" type="text" id="identificador" name="identificador"
             maxlength="20" inputmode="numeric" value="{{ identificador or '' }}"
             spellcheck="false" required autofocus>
    </div>
    <button type="submit" class="btn">Mandarme el código</button>
  </form>

  <div class="raya"></div>
  <p class="pie-ayuda">
    ¿No tiene correo cargado? Llámenos y le abrimos el acceso.<br>
    <a href="/ingresar">Volver</a>
  </p>
{% endblock %}
